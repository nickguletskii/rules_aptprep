bcr_test_module:
  - module_path: "e2e/smoke"
    matrix:
      platform: ["ubuntu2404"]
      bazel: ["8.x", "9.x"]
    tasks:
      run_tests:
        name: "Run smoke test module"
        platform: ${{ platform }}
        bazel: ${{ bazel }}
        build_flags: "--enable_bzlmod"
        test_targets:
          - "//..."
  - module_path: "e2e/cc"
    matrix:
      platform: ["ubuntu2404"]
      bazel: ["8.x", "9.x"]
    tasks:
      run_tests:
        name: "Run cc toolchain test module"
        platform: ${{ platform }}
        bazel: ${{ bazel }}
        build_flags: "--enable_bzlmod"
        test_targets:
          - "//..."
